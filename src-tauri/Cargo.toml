[package]
name = "jasper"
version = "0.1.0"
description = "JASPER — Spectral Data Platform by CheckAg"
authors = ["CheckAg"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jasper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde       = { version = "1.0", features = ["derive"] }
log         = "0.4"
tauri       = { version = "2", features = [] }
tauri-plugin-log    = "2"
tauri-plugin-shell  = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
tauri-plugin-sql    = { version = "2", features = ["sqlite"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
# default-features off: we open ports by path only (no libudev enumeration)
serialport  = { version = "4", default-features = false }
